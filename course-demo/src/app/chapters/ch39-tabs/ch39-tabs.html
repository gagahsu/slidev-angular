<div class="chapter">
  <h1>📑 Tabs</h1>

  <!-- ① mat-tab-group：適合內容固定的頁籤 -->
  <section class="demo-section">
    <h2>① mat-tab-group</h2>
    <mat-tab-group>
      <mat-tab label="First"> Content 1 </mat-tab>
      <mat-tab label="Second"> Content 2 </mat-tab>
      <mat-tab label="Third"> Content 3 </mat-tab>
    </mat-tab-group>
  </section>

  <!-- ② mat-tab-nav-bar：和路由整合 -->
  <section class="demo-section">
    <h2>② mat-tab-nav-bar（含補充練習 1、3）</h2>
    <p>isAdmin = {{ isAdmin }} <button (click)="toggleAdmin()">切換管理員</button></p>
    <!-- [tabPanel] 綁定下方的 mat-tab-nav-panel -->
    <nav mat-tab-nav-bar [tabPanel]="tabPanel">
      @for (link of links; track link) {
        <!-- [active] 為 true 時顯示底線；[disabled] 為 true 時停用 -->
        <a mat-tab-link
           (click)="activeLink = link.name"
           [routerLink]="link.path"
           [active]="activeLink == link.name"
           [disabled]="link.adminOnly && !isAdmin"> {{ link.name }} </a>
      }
      <a mat-tab-link disabled>Disabled Link</a>
    </nav>
    <!-- #tabPanel 是樣板變數；切換頁籤時只有這裡的內容會換 -->
    <mat-tab-nav-panel #tabPanel>
      <router-outlet></router-outlet>
    </mat-tab-nav-panel>
  </section>
</div>
