<div class="chapter">
  <h1>📂 Sidenav</h1>

  <!-- 補充練習 1：切換三種模式，比較主內容的變化 -->
  <section class="demo-section">
    <h2>補充練習 1：三種顯示模式（目前 {{ mode }}）</h2>
    <button (click)="mode = 'side'">side</button>
    <button (click)="mode = 'over'">over</button>
    <button (click)="mode = 'push'">push</button>
  </section>

  <section class="demo-section">
    <h2>練習：路由導覽側邊選單</h2>
    <mat-drawer-container class="menu-container" autosize>
      <!-- #drawer 讓按鈕可以呼叫 drawer.toggle()；opened 代表預設展開 -->
      <mat-drawer #drawer class="menu-sidenav" [mode]="mode" opened>
        <div class="sidenav-header">
          <mat-icon>apps</mat-icon>
          <span>頁面導覽</span>
        </div>
        <mat-nav-list>
          @for (page of pages; track page.path) {
            <!-- routerLinkActive：目前所在頁面會加上 active-link -->
            <a mat-list-item
               [routerLink]="page.path"
               routerLinkActive="active-link">
              {{ page.label }}
            </a>
          }
        </mat-nav-list>
      </mat-drawer>

      <mat-drawer-content>
        <mat-toolbar color="primary" class="menu-toolbar">
          <!-- 漢堡按鈕：開關側邊選單 -->
          <button mat-icon-button (click)="drawer.toggle()">
            <mat-icon>menu</mat-icon>
          </button>
          <span>我的應用程式</span>
        </mat-toolbar>
        <div class="menu-content">
          <!-- 目前頁面的內容顯示在這裡 -->
          <router-outlet></router-outlet>
        </div>
      </mat-drawer-content>
    </mat-drawer-container>
  </section>
</div>
