<div style="max-width: 750px; margin: 30px auto; font-family: Arial, sans-serif; padding: 20px;">

  <h1 style="color: #1a5c5c; text-align: center;">🎨 Mat-icon 圖示示範</h1>

  <!-- ① 基本用法 -->
  <div style="background: #e3f2fd; padding: 20px; border-radius: 10px; border: 2px solid #1565c0; margin-bottom: 20px;">
    <h2 style="color: #1565c0; margin-top: 0;">① 基本 mat-icon 用法</h2>
    <div style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap;">
      <div style="text-align: center;">
        <mat-icon fontIcon="home" style="font-size: 48px; width: 48px; height: 48px; color: #1565c0;"></mat-icon>
        <p style="margin: 4px 0 0; font-size: 0.85rem; color: #555;">home</p>
      </div>
      <div style="text-align: center;">
        <mat-icon fontIcon="search" style="font-size: 48px; width: 48px; height: 48px; color: #1565c0;"></mat-icon>
        <p style="margin: 4px 0 0; font-size: 0.85rem; color: #555;">search</p>
      </div>
      <div style="text-align: center;">
        <mat-icon fontIcon="favorite" style="font-size: 48px; width: 48px; height: 48px; color: #e53935;"></mat-icon>
        <p style="margin: 4px 0 0; font-size: 0.85rem; color: #555;">favorite</p>
      </div>
      <div style="text-align: center;">
        <mat-icon fontIcon="star" style="font-size: 48px; width: 48px; height: 48px; color: #f9a825;"></mat-icon>
        <p style="margin: 4px 0 0; font-size: 0.85rem; color: #555;">star</p>
      </div>
    </div>
    <div style="background: #f5f5f5; padding: 10px; border-radius: 6px; margin-top: 16px; font-family: monospace; font-size: 0.9rem;">
      &lt;mat-icon fontIcon="home"&gt;&lt;/mat-icon&gt;
    </div>
  </div>

  <!-- ② 搭配 Material 按鈕 -->
  <div style="background: #e8f5e9; padding: 20px; border-radius: 10px; border: 2px solid #2e7d32; margin-bottom: 20px;">
    <h2 style="color: #2e7d32; margin-top: 0;">② 搭配 Material 按鈕</h2>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
      <button mat-icon-button color="primary">
        <mat-icon fontIcon="home"></mat-icon>
      </button>
      <button mat-raised-button color="primary">
        <mat-icon fontIcon="add"></mat-icon>
        新增
      </button>
      <button mat-raised-button color="warn">
        <mat-icon fontIcon="delete"></mat-icon>
        刪除
      </button>
      <button mat-stroked-button color="primary">
        <mat-icon fontIcon="edit"></mat-icon>
        編輯
      </button>
    </div>
  </div>

  <!-- ③ 圖示清單 + 動態切換 -->
  <div style="background: #fff8e1; padding: 20px; border-radius: 10px; border: 2px solid #f9a825;">
    <h2 style="color: #f57f17; margin-top: 0;">③ 點擊切換圖示</h2>
    <div style="display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px;">
      @for (icon of iconList; track icon.fontIcon) {
        <button (click)="selectIcon(icon.fontIcon)"
          [style.background]="selectedIcon === icon.fontIcon ? '#f9a825' : '#fff'"
          [style.color]="selectedIcon === icon.fontIcon ? 'white' : '#333'"
          style="padding: 8px 14px; border: 2px solid #f9a825; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.9rem;">
          <mat-icon [fontIcon]="icon.fontIcon" style="font-size: 18px; width: 18px; height: 18px;"></mat-icon>
          {{ icon.name }}
        </button>
      }
    </div>
    <div style="text-align: center; padding: 20px; background: white; border-radius: 10px; border: 2px solid #ffe082;">
      <mat-icon [fontIcon]="selectedIcon" style="font-size: 80px; width: 80px; height: 80px; color: #f57f17;"></mat-icon>
      <p style="margin: 8px 0 0; font-family: monospace; color: #555;">fontIcon="{{ selectedIcon }}"</p>
    </div>
  </div>

</div>
