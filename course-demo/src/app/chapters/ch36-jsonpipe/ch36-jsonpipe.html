<div class="chapter">
  <h1>🔍 JsonPipe</h1>

  <!-- ① 直接顯示物件，只會看到 [object Object] -->
  <section class="demo-section">
    <h2>① 直接顯示物件</h2>
    <p>{{ user }}</p>
  </section>

  <!-- ② 兩種顯示 JSON 的方式 -->
  <section class="demo-section">
    <h2>② 轉換成文字</h2>
    <h3>JSON.stringify()：在 TS 手動轉換</h3>
    <p>{{ userText }}</p>
    <h3>| json：直接在 HTML 轉換（單行）</h3>
    <p>{{ user | json }}</p>
  </section>

  <!-- ③ pre 標籤會保留空白和換行，比較好閱讀 -->
  <section class="demo-section">
    <h2>③ 搭配 pre 標籤</h2>
    <pre>{{ user | json }}</pre>
  </section>
</div>
