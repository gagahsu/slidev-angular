<div class="chapter">
  <h1>🔧 Toolbar</h1>

  <!-- ① 基本結構 -->
  <section class="demo-section">
    <h2>① 基本結構與 Spacer</h2>
    <mat-toolbar>
      <button mat-icon-button>
        <mat-icon>menu</mat-icon>
      </button>
      <span>My App</span>
      <!-- Spacer 佔滿中間的空間，把後面的按鈕推到右邊 -->
      <span class="example-spacer"></span>
      <button mat-icon-button class="example-icon favorite-icon">
        <mat-icon>favorite</mat-icon>
      </button>
      <button mat-icon-button>
        <mat-icon>share</mat-icon>
      </button>
    </mat-toolbar>
  </section>

  <!-- ② mat-menu 與 matBadge -->
  <section class="demo-section">
    <h2>② mat-menu 與 matBadge</h2>
    <!-- [matMenuTriggerFor] 指定要開啟哪一個選單 -->
    <button mat-icon-button [matMenuTriggerFor]="menu">
      <mat-icon>more_vert</mat-icon>
    </button>
    <!-- #menu="matMenu" 讓上面的按鈕可以使用這個選單 -->
    <mat-menu #menu="matMenu">
      <button mat-menu-item>選項一</button>
      <button mat-menu-item>選項二</button>
    </mat-menu>
    <!-- matBadge 在右上角顯示數字 -->
    <button mat-icon-button matBadge="3" matBadgeColor="warn">
      <mat-icon>notifications</mat-icon>
    </button>
  </section>

  <!-- ③ 練習：延續 ch48 的側邊選單 -->
  <section class="demo-section">
    <h2>③ 練習：整合 Sidenav 的應用程式頂部列</h2>
    <mat-drawer-container class="menu-container" autosize>
      <mat-drawer #drawer class="menu-sidenav" mode="side" opened>
        <mat-nav-list>
          @for (page of pages; track page.path) {
            <a mat-list-item
               [routerLink]="page.path"
               routerLinkActive="active-link">
              {{ page.label }}
            </a>
          }
        </mat-nav-list>
      </mat-drawer>

      <mat-drawer-content>
        <mat-toolbar color="primary" class="menu-toolbar">
          <button mat-icon-button (click)="drawer.toggle()">
            <mat-icon>menu</mat-icon>
          </button>
          <span>我的應用程式</span>
          <span class="toolbar-spacer"></span>
          <button mat-icon-button matBadge="3" matBadgeColor="warn">
            <mat-icon>notifications</mat-icon>
          </button>
          <button mat-icon-button [matMenuTriggerFor]="userMenu">
            <mat-icon>account_circle</mat-icon>
          </button>
        </mat-toolbar>
        <div class="menu-content">
          <router-outlet></router-outlet>
        </div>
      </mat-drawer-content>
    </mat-drawer-container>

    <!-- 頭像按鈕開啟的使用者選單 -->
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item>
        <mat-icon>person</mat-icon>
        <span>個人資料</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>登出</span>
      </button>
    </mat-menu>
  </section>
</div>
