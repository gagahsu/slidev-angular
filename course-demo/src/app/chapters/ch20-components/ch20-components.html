<div class="chapter">
  <h1>🧱 新增組件</h1>

  <!-- ① 用 Angular CLI 新增元件 -->
  <section class="demo-section">
    <h2>① 使用 Angular CLI 新增元件</h2>
    <div class="code-show">
      ng g c components/header<br>
      ng g c components/footer
    </div>
  </section>

  <!-- ② 練習：像使用 HTML 標籤一樣，使用子元件 -->
  <section class="demo-section">
    <h2>② 練習：新增兩個組件</h2>
    <app-header></app-header>
    <app-footer></app-footer>
    <div class="code-show">
      &lt;app-header&gt;&lt;/app-header&gt;<br>
      &lt;app-footer&gt;&lt;/app-footer&gt;
    </div>
  </section>

  <!-- ③ 補充練習：selector 就是元件在 HTML 中的標籤名稱，可以自己取 -->
  <section class="demo-section">
    <h2>③ 補充練習：自訂 Selector 標籤名稱</h2>
    <captain-hairball></captain-hairball>
    <div class="code-show">
      &lt;captain-hairball&gt;&lt;/captain-hairball&gt;
    </div>
  </section>
</div>
