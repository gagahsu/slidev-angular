<div class="chapter">
  <h1>📋 Select</h1>

  <!-- ① 原生 select：ngModel 的值等於選中 option 的 value -->
  <section class="demo-section">
    <h2>① HTML select</h2>
    <select [(ngModel)]="selectData">
      <option value="">--Please choose an option--</option>
      <option value="volvo">Volvo</option>
      <option value="saab">Saab</option>
      <option value="mercedes">Mercedes</option>
    </select>
    <p>selectData = {{ selectData }}</p>
  </section>

  <!-- ② mat-select：取代原生 select，mat-option 取代 option -->
  <section class="demo-section">
    <h2>② mat-select</h2>
    <mat-form-field>
      <mat-label>Favorite food</mat-label>
      <mat-select>
        @for (food of foods; track food) {
          <!-- [value] 綁定實際值，畫面顯示 viewValue -->
          <mat-option [value]="food.value">{{ food.viewValue }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
  </section>

  <!-- ③ matNativeControl：保留原生 select，套用 Material 樣式 -->
  <section class="demo-section">
    <h2>③ matNativeControl</h2>
    <mat-form-field>
      <mat-label>Cars</mat-label>
      <select matNativeControl [(ngModel)]="selectData">
        <option value="volvo">Volvo</option>
        <option value="saab">Saab</option>
        <option value="mercedes">Mercedes</option>
        <option value="audi">Audi</option>
      </select>
    </mat-form-field>
  </section>

  <!-- ④ 補充練習 1 -->
  <section class="demo-section">
    <h2>④ 補充練習 1：寵物補給品選單</h2>
    <select [(ngModel)]="petChoice">
      <option value="cat-can">貓咪主食罐</option>
      <option value="nutri-paste">離乳營養膏</option>
    </select>
    <p>您選擇的是：{{ petChoice }}</p>
  </section>

  <!-- ⑤ 補充練習 3 -->
  <section class="demo-section">
    <h2>⑤ 補充練習 3：用 &#64;for 產生選項</h2>
    <mat-form-field>
      <mat-label>貓咪品種</mat-label>
      <select matNativeControl [(ngModel)]="selectedBreed">
        @for (breed of catBreeds; track breed.code) {
          <option [value]="breed.code">{{ breed.name }}</option>
        }
      </select>
    </mat-form-field>
    <p>品種代碼：{{ selectedBreed }}</p>
  </section>
</div>
