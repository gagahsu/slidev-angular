<div class="chapter">
  <h1>🔢 資料排序</h1>

  <!-- ① 點擊按鈕後，下方表格會跟著改變順序 -->
  <section class="demo-section">
    <h2>① sort() 排序</h2>
    <button (click)="sortByPosition()">依 position</button>
    <button (click)="sortByName()">依 name</button>
    <button (click)="sortByWeight()">練習：依 weight（並印出）</button>
    <table>
      <thead>
        <tr><th>No.</th><th>Name</th><th>Weight</th><th>Symbol</th></tr>
      </thead>
      <tbody>
        <!-- @for 跑過陣列，每筆產生一列 -->
        @for (element of ELEMENT_DATA; track element.symbol) {
          <tr>
            <td>{{ element.position }}</td>
            <td>{{ element.name }}</td>
            <td>{{ element.weight }}</td>
            <td>{{ element.symbol }}</td>
          </tr>
        }
      </tbody>
    </table>
  </section>

  <!-- ② 補充練習 -->
  <section class="demo-section">
    <h2>② 補充練習（打開 F12 → Console 看結果）</h2>
    <button (click)="sortNumbers()">1：數字升序</button>
    <button (click)="sortBySymbolDesc()">2：symbol 降序（Z → A）</button>
  </section>
</div>
