<div class="chapter">
  <h1>💬 Dialog</h1>

  <!-- ① 練習 -->
  <section class="demo-section">
    <h2>① 練習：建立 Dialog 對話框</h2>
    <button mat-raised-button (click)="showDialog()">開啟 Dialog</button>
    <p class="hint">輸入後按確定，打開 F12 → Console 查看回傳值</p>
  </section>

  <!-- ② 補充練習 1 -->
  <section class="demo-section">
    <h2>② 補充練習 1：確認刪除彈窗</h2>
    <button mat-raised-button (click)="openConfirm()">刪除資料</button>
  </section>

  <!-- ③ 補充練習 2 要修改程式才看得到，所以這裡只列出步驟 -->
  <section class="demo-section">
    <h2>③ 補充練習 2：沒有設定寬度會怎樣？</h2>
    <p>在 ConfirmDialog 塞入一長串文字，把 openConfirm() 的 width 拿掉，再加上 width: '600px' 比較差異</p>
  </section>

  <!-- ④ 補充練習 3 -->
  <section class="demo-section">
    <h2>④ 補充練習 3：彈窗修改庫存數量</h2>
    <p>目前庫存：{{ stock }}</p>
    <button mat-raised-button (click)="openStock()">修改庫存</button>
  </section>
</div>
