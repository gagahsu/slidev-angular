<div class="chapter">
  <h1>📊 圓餅圖</h1>

  <!-- ① 練習：外層要限制寬高，否則圖表會撐滿容器 -->
  <section class="demo-section">
    <h2>① 練習：繪製支出圓餅圖</h2>
    <div class="chart-box">
      <!-- id 用來在 TS 取得這個 canvas -->
      <canvas id="chart"></canvas>
    </div>
  </section>

  <!-- ② 補充練習 1 -->
  <section class="demo-section">
    <h2>② 補充練習 1：切換成環狀圖</h2>
    <div class="chart-box">
      <canvas id="chart-doughnut"></canvas>
    </div>
  </section>

  <!-- ③ 補充練習 2：@for 產生多個 canvas，每個 id 都不同 -->
  <section class="demo-section">
    <h2>③ 補充練習 2：用 &#64;for 呈現多張圖表</h2>
    <div class="chart-row">
      @for (item of chartList; track item.title) {
        <div class="chart-small">
          <h3>{{ item.title }}</h3>
          <!-- [id] 是屬性綁定，$index 是目前第幾筆 -->
          <canvas [id]="'chart-' + $index"></canvas>
        </div>
      }
    </div>
  </section>
</div>
