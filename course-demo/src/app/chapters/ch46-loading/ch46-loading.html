<!-- 投影片把 Spinner 放在 app.component.html，讓所有頁面共用；這裡只在這一章示範 -->
<!-- async pipe 會自動訂閱 Observable，元件銷毀時也會自動取消訂閱 -->
@if (loading$ | async) {
  <div class="overlay">
    <div class="spinner-box">
      <mat-spinner [diameter]="70"></mat-spinner>
    </div>
  </div>
}

<div class="chapter">
  <h1>⏳ Loading</h1>

  <section class="demo-section">
    <h2>① 手動呼叫 show() / hide()</h2>
    <button (click)="manualLoading()">顯示 Loading（2 秒）</button>
  </section>

  <section class="demo-section">
    <h2>② HttpInterceptor：自動觸發 Loading</h2>
    <button (click)="callApi()">呼叫 API</button>
  </section>
</div>
