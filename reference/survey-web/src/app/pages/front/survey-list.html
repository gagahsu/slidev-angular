<h2>問卷列表</h2>
<form class="card row" [formGroup]="form" (ngSubmit)="search()">
  <mat-form-field appearance="outline">
    <mat-label>問卷名稱</mat-label>
    <input matInput formControlName="title" placeholder="標題模糊搜尋" />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>開始日期</mat-label>
    <input matInput [matDatepicker]="p1" formControlName="startDate" />
    <mat-datepicker-toggle matIconSuffix [for]="p1" />
    <mat-datepicker #p1 />
  </mat-form-field>
  <mat-form-field appearance="outline">
    <mat-label>結束日期</mat-label>
    <input matInput [matDatepicker]="p2" formControlName="endDate" />
    <mat-datepicker-toggle matIconSuffix [for]="p2" />
    <mat-datepicker #p2 />
  </mat-form-field>
  <button mat-flat-button type="submit">搜尋</button>
  <button mat-button type="button" (click)="reset()">清除</button>
</form>

<table mat-table [dataSource]="page().content">
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef>編號</th>
    <td mat-cell *matCellDef="let s">{{ s.id }}</td>
  </ng-container>
  <ng-container matColumnDef="title">
    <th mat-header-cell *matHeaderCellDef>名稱</th>
    <td mat-cell *matCellDef="let s">
      <!-- 只有「進行中」才有連結 -->
      @if (s.status === 'ONGOING') { <a [routerLink]="['/surveys', s.id, 'fill']">{{ s.title }}</a> }
      @else { <span class="muted">{{ s.title }}</span> }
    </td>
  </ng-container>
  <ng-container matColumnDef="statusLabel">
    <th mat-header-cell *matHeaderCellDef>狀態</th>
    <td mat-cell *matCellDef="let s">{{ s.statusLabel }}</td>
  </ng-container>
  <ng-container matColumnDef="startDate">
    <th mat-header-cell *matHeaderCellDef>開始時間</th>
    <td mat-cell *matCellDef="let s">{{ s.startDate }}</td>
  </ng-container>
  <ng-container matColumnDef="endDate">
    <th mat-header-cell *matHeaderCellDef>結束時間</th>
    <td mat-cell *matCellDef="let s">{{ s.endDate }}</td>
  </ng-container>
  <ng-container matColumnDef="stats">
    <th mat-header-cell *matHeaderCellDef>統計</th>
    <td mat-cell *matCellDef="let s">
      @if (s.status === 'ONGOING' || s.status === 'ENDED') { <a [routerLink]="['/surveys', s.id, 'stats']">觀看統計</a> }
    </td>
  </ng-container>
  <tr mat-header-row *matHeaderRowDef="columns"></tr>
  <tr mat-row *matRowDef="let row; columns: columns"></tr>
</table>
@if (page().totalElements === 0) { <p class="muted">沒有符合條件的問卷</p> }

<mat-paginator [length]="page().totalElements" [pageSize]="page().size" [pageIndex]="page().page"
  [pageSizeOptions]="[5, 10, 20]" (page)="onPage($event)" showFirstLastButtons />
