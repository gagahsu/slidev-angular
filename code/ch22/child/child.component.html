<!--
  === 第22章：子元件 HTML ===

  子元件接收父元件的資料（@Input）並顯示，
  使用者點擊後透過 @Output 把選擇傳回父元件。
-->

<div style="background: #e8f5e9; padding: 20px; border-radius: 10px; border: 2px solid #2e7d32;">

  <h3 style="color: #2e7d32; margin-top: 0;">🧩 子元件 (ChildComponent)</h3>

  <!-- 顯示從父元件傳來的 @Input message -->
  <p>來自父元件的訊息：<em>{{ message }}</em></p>

  <h4>點擊選擇商品（點擊後會通知父元件）：</h4>

  <!-- 用 @for 顯示從父元件傳來的 @Input items 陣列 -->
  <div style="display: flex; gap: 10px; flex-wrap: wrap;">
    @for (item of items; track item) {
      <button
        (click)="onItemClick(item)"
        style="padding: 10px 16px; background: #5eada0; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 1rem;">
        {{ item }}
      </button>
    }
  </div>

</div>
