<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>練習 1 - 大標題</title>
</head>
<body>

  <!--
    === 練習 1：用 h1 標籤顯示大標題 ===

    目標：在頁面上顯示「HTML練習」這幾個字（大標題樣式）

    步驟解說：
    ① 找到 body 標籤（這是我們放內容的地方）
    ② 在 body 裡面寫 <h1> 標籤
    ③ 在 <h1> 和 </h1> 之間放你想顯示的文字
    ④ 存檔後用瀏覽器打開看結果

    h1 是「最大標題」，瀏覽器會自動把它顯示成大大的粗體字。
  -->

  <h1>HTML練習</h1>

</body>
</html>
