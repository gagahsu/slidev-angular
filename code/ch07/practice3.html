<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>練習 3 - 標題+文字+圖片</title>
</head>
<body>

  <!--
    === 練習 3：標題 + 文字 + 圖片 ===

    目標：做出包含以下內容的頁面：
    1. 大標題「HTML練習」
    2. 一行說明文字「可愛的圖片」
    3. 一張圖片

    重點標籤：
    - <h1>：大標題
    - <p>：段落文字
    - <img>：圖片（單標籤！不需要結尾標籤）

    img 標籤的屬性：
    - src：圖片的路徑（可以是本機路徑或網址）
    - alt：圖片無法顯示時的替代文字（也有 SEO 效果）
    - width：圖片寬度
  -->

  <h1>HTML練習</h1>

  <p>可愛的圖片</p>

  <!--
    圖片來源用一張可愛的動物圖片
    如果圖片路徑是本機檔案，請把圖片放在同一個資料夾，
    然後把 src 改成像 "cute-cat.jpg" 這樣的本機路徑
  -->
  <img
    src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b6/Image_created_with_a_mobile_phone.png/640px-Image_created_with_a_mobile_phone.png"
    alt="可愛的圖片"
    width="300">

</body>
</html>
