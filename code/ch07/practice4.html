<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>練習 4 - 表格</title>
</head>
<body>

  <!--
    === 練習 4：建立成績表格 ===

    目標：做出一個包含「姓名、數學、英文」三欄的成績表格

    表格的結構（像蓋樓）：
    - <table>  → 整棟大樓（最外層容器）
      - <thead> → 一樓大廳（表格標頭）
        - <tr>  → 一個「樓層」（橫列）
          - <th> → 樓層裡的「房間」（標頭格，字體加粗）
      - <tbody> → 二樓以上（表格主體）
        - <tr>  → 每一個橫列
          - <td> → 每一格資料

    口訣：「先有樓層 tr，才有房間 td/th」
    → 先寫 <tr>，再在裡面寫 <td> 或 <th>
  -->

  <h1>HTML練習</h1>

  <table border="1">
    <!-- 表格標頭：欄位名稱 -->
    <thead>
      <tr>
        <th>姓名</th>  <!-- th 的文字會自動加粗並置中 -->
        <th>數學</th>
        <th>英文</th>
      </tr>
    </thead>

    <!-- 表格主體：資料 -->
    <tbody>
      <!-- 第一筆資料：小明 -->
      <tr>
        <td>小明</td>  <!-- td 的文字是一般樣式 -->
        <td>90</td>
        <td>85</td>
      </tr>

      <!-- 第二筆資料：小華 -->
      <tr>
        <td>小華</td>
        <td>70</td>
        <td>95</td>
      </tr>
    </tbody>
  </table>

</body>
</html>
