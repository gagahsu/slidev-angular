<!--
  === 第19章：在 app.component.html 使用子元件 ===

  元件化的好處：
  → 把「頁首」獨立成 <app-header> 元件
  → 這樣 app.component.html 就很乾淨！

  使用子元件的步驟：
  ① 用 ng g c 建立元件
  ② 在父元件的 ts 檔的 imports 陣列中加入子元件
  ③ 在 HTML 用 <app-元件名稱> 引用
-->

<!-- 使用 Header 元件（一行就搞定整個頁首！） -->
<app-header></app-header>

<!-- 主要內容區 -->
<main style="max-width: 900px; margin: 30px auto; padding: 0 20px;">
  <h1>歡迎來到 Angular 學習平台</h1>
  <p>這個頁面示範了如何使用「元件化」的方式拆解畫面。</p>
  <p>上面的 Header 是一個獨立的 <code>HeaderComponent</code>，把它寫成獨立元件之後，在任何頁面用 <code>&lt;app-header&gt;</code> 一行就能加上頁首。</p>
  <p>修改頁首的樣式或內容，也只要改 <code>header.component.html</code> 一個地方就好！</p>
</main>
