<!--
  === 第21章：課程詳情頁 HTML（動態路由參數）===

  這個元件對應 /courses/:id 路由
  URL 裡的 :id 會被讀進來，用來決定顯示哪堂課
-->
<div style="max-width: 700px; margin: 30px auto; padding: 0 20px; font-family: Arial, sans-serif;">

  @if (courseData) {
    <h1 style="color: #1a5c5c;">📚 {{ courseData.name }}</h1>
    <div style="background: #f5f5f5; padding: 20px; border-radius: 10px;">
      <p>講師：{{ courseData.instructor }}</p>
      <p>時數：{{ courseData.hours }} 小時</p>
      <p>課程 ID：{{ courseId }}（來自 URL 的 :id 參數）</p>
    </div>
  } @else {
    <h1 style="color: #e74c3c;">❌ 找不到課程</h1>
    <p>ID 為 {{ courseId }} 的課程不存在。</p>
  }

  <br>
  <a routerLink="/" style="color: #5eada0;">← 回到首頁</a>

</div>
